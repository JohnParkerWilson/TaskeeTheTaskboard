services:
  - type: web
    name: task-board-node-js
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: task-board-data
      mountPath: /var/data
      sizeGB: 1
